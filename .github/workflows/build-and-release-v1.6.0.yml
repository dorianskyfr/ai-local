name: Build and Release v1.6.0

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Install Linux dependencies
      if: matrix.os == 'ubuntu-latest'
      run: sudo apt-get update && sudo apt-get install -y rpm fuse libx11-xcb1 libxcomposite1 libxcursor1 libxdamage1 libxi6 libxtst6 libnss3 libcups2 libxss1 libxrandr2 libasound2 libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0

    - name: Build
      run: npx electron-builder --${{ matrix.os == 'ubuntu-latest' && 'linux' || 'win' }} --x64 --publish never
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-binaries
        path: dist/
        retention-days: 7

  release:
    needs: build
    runs-on: ubuntu-latest
    
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Create release
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          const version = '1.6.0';
          
          let body = '';
          try {
            body = fs.readFileSync('RELEASE-v1.6.0.md', 'utf8');
          } catch (e) {
            body = 'AI Local v' + version;
          }
          
          try {
            const release = await github.rest.repos.getReleaseByTag({
              owner: 'dorianskyfr',
              repo: 'ai-local',
              tag: 'v' + version
            });
            await github.rest.repos.deleteRelease({
              owner: 'dorianskyfr',
              repo: 'ai-local',
              release_id: release.data.id
            });
          } catch (e) {}
          
          const newRelease = await github.rest.repos.createRelease({
            owner: 'dorianskyfr',
            repo: 'ai-local',
            tag_name: 'v' + version,
            name: 'AI Local v' + version,
            body: body,
            draft: false,
            prerelease: false
          });
          
          const files = [];
          function findFiles(dir) {
            try {
              const items = fs.readdirSync(dir);
              for (const item of items) {
                const fullPath = path.join(dir, item);
                const stat = fs.statSync(fullPath);
                if (stat.isDirectory()) {
                  findFiles(fullPath);
                } else if (item.match(/\.(AppImage|deb|exe)$/i)) {
                  files.push(fullPath);
                }
              }
            } catch (e) {}
          }
          findFiles('artifacts');
          
          for (const filePath of files) {
            const fileName = path.basename(filePath);
            const fileData = fs.readFileSync(filePath);
            try {
              await github.rest.repos.uploadReleaseAsset({
                owner: 'dorianskyfr',
                repo: 'ai-local',
                release_id: newRelease.data.id,
                name: fileName,
                data: fileData,
                headers: {'content-type': 'application/octet-stream'}
              });
            } catch (e) {}
          }
