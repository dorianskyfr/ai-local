name: Build v1.6.0 Complete - All Platforms

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build'
        required: true
        default: '1.6.0'
      create-release:
        description: 'Create GitHub release'
        required: true
        default: 'true'
        type: boolean
  push:
    branches:
      - main

jobs:
  build-linux:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Install electron-builder dependencies
      run: sudo apt-get update && sudo apt-get install -y rpm fuse libx11-xcb1 libxcomposite1 libxcursor1 libxdamage1 libxi6 libxtst6 libnss3 libcups2 libxss1 libxrandr2 libasound2 libatk1.0-0 libatk-bridge2.0-0 libgtk-3-0

    - name: Build Linux (AppImage + DEB)
      run: npx electron-builder --linux --x64 --publish never
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: List Linux artifacts
      run: ls -la dist/ || true

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-binaries
        path: dist/
        retention-days: 7

  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install

    - name: Build Windows (Portable EXE + NSIS Installer)
      run: npx electron-builder --win --x64 --publish never
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: List Windows artifacts
      run: dir dist\ || true

    - name: Upload Windows artifacts
      uses: actions/upload-artifact@v4
      with:
        name: windows-binaries
        path: dist/
        retention-days: 7

  create-release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    
    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: List all artifacts
      run: find artifacts -type f -name "*.AppImage" -o -name "*.deb" -o -name "*.exe" | sort

    - name: Create release and upload assets
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          const path = require('path');
          
          const version = '${{ inputs.version || "1.6.0" }}';
          const createRelease = '${{ inputs.create-release || "true" }}' === 'true';
          
          if (!createRelease) {
            console.log('Skipping release creation (create-release=false)');
            return;
          }
          
          // Lire le body de la release
          let body = '';
          try {
            body = fs.readFileSync('RELEASE-v1.6.0.md', 'utf8');
          } catch (e) {
            body = `AI Local v${version} - Collaborative Model System\n\nAll-in-one release with Windows and Linux binaries.`;
          }
          
          // Supprimer l'ancienne release si elle existe
          try {
            const release = await github.rest.repos.getReleaseByTag({
              owner: 'dorianskyfr',
              repo: 'ai-local',
              tag: `v${version}`
            });
            await github.rest.repos.deleteRelease({
              owner: 'dorianskyfr',
              repo: 'ai-local',
              release_id: release.data.id
            });
            console.log('✅ Old release deleted');
          } catch (error) {
            console.log('No old release to delete');
          }
          
          // Créer la nouvelle release
          const newRelease = await github.rest.repos.createRelease({
            owner: 'dorianskyfr',
            repo: 'ai-local',
            tag_name: `v${version}`,
            name: `AI Local v${version}`,
            body: body,
            draft: false,
            prerelease: false
          });
          
          console.log('✅ Release created:', newRelease.data.id);
          
          // Trouver et uploader tous les assets
          const files = [];
          function findFiles(dir) {
            try {
              const items = fs.readdirSync(dir);
              for (const item of items) {
                const fullPath = path.join(dir, item);
                const stat = fs.statSync(fullPath);
                if (stat.isDirectory()) {
                  findFiles(fullPath);
                } else if (item.match(/\.(AppImage|deb|exe)$/i)) {
                  files.push(fullPath);
                }
              }
            } catch (e) {
              console.error('Error reading directory:', e.message);
            }
          }
          findFiles('artifacts');
          
          console.log('Files to upload:', files);
          
          // Upload each file
          for (const filePath of files) {
            const fileName = path.basename(filePath);
            const fileData = fs.readFileSync(filePath);
            console.log(`Uploading ${fileName} (${(fileData.length / 1024 / 1024).toFixed(2)} MB)...`);
            
            try {
              await github.rest.repos.uploadReleaseAsset({
                owner: 'dorianskyfr',
                repo: 'ai-local',
                release_id: newRelease.data.id,
                name: fileName,
                data: fileData,
                headers: {
                  'content-type': 'application/octet-stream'
                }
              });
              console.log(`✅ Uploaded ${fileName}`);
            } catch (error) {
              console.error(`❌ Failed to upload ${fileName}:`, error.message);
            }
          }
          
          console.log('✅ All assets uploaded successfully!');
